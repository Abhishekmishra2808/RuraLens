services:
  # ─── Python GNN Model API (FastAPI) ─────────────────────────────────────────
  - type: web
    name: ruralens-gnn-api
    env: python
    region: singapore
    plan: free
    rootDir: backend/python-gnn
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: models/gnn_model.pt

  # ─── Backend API (Node.js) ───────────────────────────────────────────────────
  - type: web
    name: ruralens-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@ruralens.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator
      - key: PYTHON_GNN_API_URL
        value: https://ruralens-gnn-api-mfss.onrender.com
      # Strands Agents SDK requires Node >= 22.
      - key: NODE_VERSION
        value: "22"
      # Amazon Bedrock (Copilot + vendor report comparison); see docs/BEDROCK.md.
      # Render has no AWS role attached, so credentials come from a least-privilege
      # IAM user's access key set in the dashboard. Never add these to the frontend.
      - key: AWS_REGION
        sync: false
      - key: BEDROCK_MODEL_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Alternative to the access keys: a Bedrock API key, with BEDROCK_API=openai
      # to use the OpenAI-compatible endpoint (see docs/BEDROCK.md)
      - key: BEDROCK_API
        sync: false
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false

  # ─── Frontend Static Site (React/Vite) ──────────────────────────────────────
  - type: web
    name: ruralens-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ruralens-backend-314u.onrender.com
      # CesiumJS 1.146 requires Node >= 22 at build time.
      - key: NODE_VERSION
        value: "22"
      # Cesium ion token for the 3D digital twin. Set in the Render dashboard; it is
      # embedded in the browser bundle, so restrict it to this site's domain in ion.
      - key: VITE_CESIUM_ION_TOKEN
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
